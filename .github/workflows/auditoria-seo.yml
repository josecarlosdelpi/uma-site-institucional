name: Auditoria SEO UMA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-seo:
    name: Verificar paginas, links e URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Executar auditoria SEO local
        run: node scripts/auditar-seo.mjs
